    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preload" href="../fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../fonts/fonts.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/brand.css">
    <link rel="stylesheet" href="../css/shop-ui.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/motion.css">
    <link rel="stylesheet" href="../css/cards-productos.css">
    <link rel="stylesheet" href="../css/brand-pages.css">
    <link rel="stylesheet" href="../css/home-v3.css">
    <script src="../js/pages-motion.js"></script>
    <link rel="stylesheet" href="../css/notice.css">
</head>
<body>
    <a class="skip-link" href="#resetForm">Saltar al formulario</a>
    <header class="site-header site-header--solid" id="siteHeader">
        <a class="brand-logo" href="../index.html" aria-label="YoguraSo, ir al inicio">
            <img class="logo-rojo" src="../assets/brand/logo-primary.svg" alt="YoguraSo" width="3105" height="1119">
        </a>
        <nav class="nav" aria-label="Principal">
            <button type="button" class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-items">
                <span></span><span></span><span></span>
            </button>
                        <ul id="nav-items">
                <li><a href="productos.html">Sabores</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="../index.html#nosotros">Nosotros</a></li>
                <li><a href="../index.html#distribuidores">Distribuidores</a></li>
                <li><a href="../index.html#contact">Contacto</a></li>
            </ul>
        </nav>
        <div class="icon-buttons">
            <a class="icon-btn" href="productos.html#buscar" aria-label="Buscar sabores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.8"/><path d="m15.6 15.6 5 5"/></svg></a>
            <button type="button" class="icon-btn" id="cartBtn" aria-label="Abrir carrito">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h2.6l2.2 11.2a1.6 1.6 0 0 0 1.6 1.3h8.1a1.6 1.6 0 0 0 1.6-1.2l1.4-6.4H6.2"/><circle cx="9.6" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
                <span class="cart-badge" id="cart-count" hidden>0</span>
            </button>
        </div>
    </header>

    <div class="auth-container">
        <div class="shop-auth-wrap">
            <aside class="shop-auth-promo" aria-hidden="true">
                <div>
                    <p class="shop-kicker">Seguridad</p>
                    <h2>Elige una clave nueva.</h2>
                    <p>El enlace del correo expira en 1 hora.</p>
                </div>
            </aside>
        <div class="auth-card">
            <p class="shop-kicker">Cuenta</p>
            <h1 class="auth-title">Nueva <span>contraseña</span></h1>
            <p class="auth-lead">Mínimo 6 caracteres. Guárdala en un lugar seguro.</p>

            <form class="auth-form" id="resetForm">
                <input type="hidden" id="reset-token" value="">
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Nueva contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="8" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm-password"><i class="fas fa-lock"></i> Confirmar contraseña</label>
                    <input type="password" id="confirm-password" placeholder="••••••••" required minlength="8" autocomplete="new-password">
                </div>
                <button type="submit" class="auth-submit">Guardar contraseña</button>
            </form>

            <p class="auth-redirect">
                <a href="recuperar.html">Solicitar un enlace nuevo</a> · <a href="login.html">Ir al login</a>
            </p>
        </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/notice.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/ui-motion.js"></script>
    <script src="../js/sound.js"></script>
    <script src="../js/cart.js"></script>
    <script type="module" src="../js/auth.js"></script>
</body>
</html>
