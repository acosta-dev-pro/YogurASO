<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; width: 420px; height: 360px; background: #fff8f4; }
    .wrap { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; font-family: "Segoe UI", sans-serif; }
    .mark { width: 140px; height: 140px; margin: 0 auto 12px; border-radius: 28px; background: #FA5053; position: relative; }
    .bowl { position: absolute; left: 50%; top: 38%; width: 70px; height: 70px; margin-left: -35px; margin-top: -35px; background: #fff8f4; border-radius: 50%; }
    .smile { position: absolute; left: 50%; top: 68%; width: 56px; height: 28px; margin-left: -28px; border: 5px solid #fff8f4; border-top: none; border-radius: 0 0 56px 56px; box-sizing: border-box; }
    .d1,.d2,.d3 { position: absolute; width: 8px; height: 8px; background: #FA5053; border-radius: 50%; z-index: 2; }
    .d1 { left: 42%; top: 36%; }
    .d2 { left: 50%; top: 32%; }
    .d3 { left: 58%; top: 38%; }
    h1 { margin: 8px 0 0; color: #FA5053; font-size: 34px; font-weight: 800; letter-spacing: 0.5px; }
    p { margin: 6px 0 0; color: #7a4a4a; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="mark">
        <div class="bowl"></div>
        <div class="d1"></div><div class="d2"></div><div class="d3"></div>
        <div class="smile"></div>
      </div>
      <h1>YogurASO</h1>
      <p>Yogurt artesanal</p>
    </div>
  </div>
</body>
</html>
